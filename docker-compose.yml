name: gitlab-docker

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-50m}
    max-file: ${DOCKER_LOG_MAX_FILES:-5}

services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION:?Copy .env.example to .env}
    hostname: ${GITLAB_HOSTNAME:-apps.localmac.net}
    restart: "no"
    stop_grace_period: 1m
    shm_size: 256m
    logging: *default-logging
    environment:
      TZ: ${GITLAB_TIMEZONE:-Asia/Shanghai}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://${GITLAB_HOSTNAME:-apps.localmac.net}:${GITLAB_HTTPS_PORT:-8445}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}
        nginx['listen_https'] = false
        nginx['listen_port'] = 80
        letsencrypt['enable'] = false
        gitlab_rails['backup_keep_time'] = 604800
        prometheus_monitoring['enable'] = true
    expose:
      - "80"
    ports:
      - "${GITLAB_BIND_ADDRESS:-127.0.0.1}:${GITLAB_SSH_PORT:-2222}:22"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
      - ./backups:/var/opt/gitlab/backups
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck", "--fail", "--max-time", "10"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 10m
    networks:
      gitlab:
      tooling-edge:
        aliases:
          - gitlab

  runner:
    image: gitlab/gitlab-runner:${GITLAB_RUNNER_VERSION:-alpine-v19.2.1}
    restart: "no"
    init: true
    logging: *default-logging
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CADDY_ROOT_CA_PATH:-../jenkins-docker/certs/caddy-local-root.crt}:/etc/gitlab-runner/certs/${GITLAB_HOSTNAME:-apps.localmac.net}.crt:ro
    networks:
      - gitlab
      - tooling-edge
    profiles: ["runner"]

networks:
  gitlab:
    driver: bridge
  tooling-edge:
    external: true
    name: ${TOOLING_EDGE_NETWORK:-local-tooling-edge}

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-config:
